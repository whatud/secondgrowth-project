const KEY = "sg-share-pw";
const d64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function open_(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: d64(P.s), iterations: P.n, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const buf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: d64(P.i) }, key, d64(P.c));
  return new TextDecoder().decode(buf);
}
function show(html) { document.open(); document.write(html); document.close(); }
(async () => {
  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved) { try { show(await open_(saved)); return; } catch (e) { try { localStorage.removeItem(KEY); } catch (x) {} } }
  document.getElementById("box").style.display = "block";
  document.getElementById("f").onsubmit = async (ev) => {
    ev.preventDefault();
    const pw = document.getElementById("pw").value.trim();
    document.getElementById("err").textContent = "여는 중...";
    try { const html = await open_(pw); try { localStorage.setItem(KEY, pw); } catch (e) {} show(html); }
    catch (e) { document.getElementById("err").textContent = "비밀번호가 맞지 않아요."; }
  };
})();
</script>
